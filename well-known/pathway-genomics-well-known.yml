conclusion: >-
  Pathway Genomics has no API surface to enrich and no host it still controls. The company
  never published a developer program, public API, SDK, CLI, or machine-readable
  specification; its consumer- and clinician-facing products were ordered through a web
  storefront and a mobile app, and its OME assistant was an IBM Watson-backed consumer app,
  not a published API. This is a historical record, not a thin profile. Any future round
  should re-read host_status before probing pathwaygenomics.com again.
