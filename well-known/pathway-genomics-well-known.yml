description: >-
  Negative probe record for Pathway Genomics. The Pathway Genomics brand was retired: the
  company renamed itself Pathway OME, and on 2021-01-25 its assets were acquired by investor
  OME Ventures and rebranded OME Wellness. The historic host pathwaygenomics.com (registered
  2008-11-04, the company's own registration) is now delegated to Afternic nameservers and
  serves a GoDaddy aftermarket parking lander advertising the domain FOR SALE. That lander
  answers HTTP 200 with the SAME 114-byte HTML redirect shell for EVERY path, including every
  /.well-known/* path and every spec path. NONE of those 200s is a document. No WellKnown,
  SecurityTxt, AgentCard, LLMsTxt or OpenAPI pointer is emitted from this probe, and none
  should ever be emitted from it in a later round.

